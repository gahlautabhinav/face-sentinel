spring:
  application:
    name: logbook360-face-recognition
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET}
  rekognition:
    collection-prefix: ${REKOGNITION_COLLECTION_PREFIX:logbook360}
    similarity-threshold: ${REKOGNITION_SIMILARITY_THRESHOLD:90.0}
    min-face-coverage: ${REKOGNITION_MIN_FACE_COVERAGE:0.10}
    max-center-offset: ${REKOGNITION_MAX_CENTER_OFFSET:0.25}

face-recognition:
  enabled: true
  liveness:
    enabled: ${FACE_LIVENESS_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:changeme-jwt-secret-for-dev-only-min-32-chars}
  expiry-hours: ${JWT_EXPIRY_HOURS:24}

auth:
  admin-client-id: ${ADMIN_CLIENT_ID:logbook360-admin}
  admin-client-secret: ${ADMIN_CLIENT_SECRET:changeme-admin-secret}
  kiosk-client-id: ${KIOSK_CLIENT_ID:logbook360-kiosk}
  kiosk-client-secret: ${KIOSK_CLIENT_SECRET:changeme-kiosk-secret}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
