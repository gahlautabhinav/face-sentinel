name: Keep backend awake

# The backend runs on a free Render instance, which is put to sleep after about 15 minutes
# without traffic and then takes around a minute to wake. One request every 10 minutes keeps
# it awake. Delete this file (or disable the workflow) when the live demo is no longer needed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the backend
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 150 \
            https://face-sentinel-api.onrender.com/api/health || true)
          echo "backend answered HTTP $code"
