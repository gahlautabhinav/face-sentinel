version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: logbook360-postgres
    environment:
      POSTGRES_DB: logbook360_face
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: logbook360-face-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/logbook360_face
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      REKOGNITION_COLLECTION_PREFIX: logbook360-dev
      REKOGNITION_SIMILARITY_THRESHOLD: "90.0"
      FACE_LIVENESS_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
